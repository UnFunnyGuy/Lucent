name: Develop Integration

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

concurrency:
  group: develop-integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Full Integration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Full Quality + Build
        run: ./gradlew spotlessCheck lint test assembleDebug

      - name: Upload Lint Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: develop-lint-reports
          path: '**/build/reports/lint-results-*.html'

      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: develop-test-reports
          path: '**/build/reports/tests/'
